name: Stale

on:
  schedule:
    - cron: "30 1 * * *" # Every day at 01:30
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Manage Stale Issues/PRs
    runs-on: ubuntu-latest

    steps:
      - name: Mark & Close Stale Issues/PRs
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been marked as stale because it has no activity for 30 days.
            It will be closed in 7 days if no further action is taken.
            Please comment if this issue is still relevant.
          stale-pr-message: >
            This PR has been marked as stale because it has no activity for 30 days.
            It will be closed in 7 days if no further action is taken.
            Please push new commits or comment to keep it open.
          close-issue-message: "Closing due to inactivity."
          close-pr-message: "Closing PR due to inactivity."
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,critical"
          exempt-pr-labels: "pinned,security,critical"
